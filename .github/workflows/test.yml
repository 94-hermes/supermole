name: Validation

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit & Integration Tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        # fd keeps tests/installer_fd.bats in the run: scripts/test.sh drops the
        # whole file when fd is missing, which silently hid its 25 cases.
        run: brew install bats-core shellcheck coreutils parallel fd

      - name: Install dmgbuild
        # Keeps tests/dmg_build.bats, the real build of the dmg installer, in
        # the run: scripts/test.sh drops it when dmgbuild is not on PATH.
        run: ./scripts/install_dmgbuild.sh "$RUNNER_TEMP/dmgbuild" >> "$GITHUB_PATH"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run test script
        env:
          # The perf cases now time a plain child shell, not the Bats DEBUG
          # trap, so these budgets can be tight enough to catch a new fork per
          # call while still leaving several times the local measurement.
          MOLE_PERF_BYTES_TO_HUMAN_LIMIT_MS: "1000"
          MOLE_PERF_NORMALIZE_PATHS_LIMIT_MS: "10000"
          MOLE_TEST_JOBS: "6"
          # Emits a "Slowest test files" table at the end of the run. Parallel
          # TAP output cannot be attributed to a file, so without this a single
          # slow file that sets the whole job's wall clock stays invisible.
          MOLE_TEST_REPORT_DIR: ${{ runner.temp }}/bats-report
          BATS_FORMATTER: tap
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: ./scripts/test.sh

  compatibility:
    name: macOS
    # Hosted runtime coverage is macOS 15 and 26, not macOS 14. macOS 26 is
    # pinned so it stays a distinct lane after macos-latest, which the full
    # test job uses, moves on. Release builds separately enforce an
    # LC_BUILD_VERSION minimum of macOS 12 in check_release_minos.sh.
    strategy:
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install bats
        run: brew install bats-core coreutils

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Smoke load on ${{ matrix.os }}
        run: |
          echo "Testing on ${{ matrix.os }}..."
          bash -n mole
          source lib/core/common.sh
          echo "✓ Successfully loaded on ${{ matrix.os }}"

      - name: Run core bats subset
        env:
          MOLE_TEST_NO_AUTH: "1"
          MOLE_PERF_NORMALIZE_PATHS_LIMIT_MS: "10000"
          BATS_FORMATTER: tap
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        # clean_app_caches.bats is here because it is the suite that reads
        # system tool output whose format varies by macOS version, which the
        # full run on macos-latest cannot see. tw93/Mole#1512 was reported on
        # macOS 15, fixed, then silently regressed for eight days with CI green
        # the whole time, because that file was not in this subset. It adds
        # about 16s to a job that runs in 90s under a 30 minute budget.
        run: |
          bats tests/core_safe_functions.bats \
               tests/core_common.bats \
               tests/core_timeout.bats \
               tests/regression.bats \
               tests/cli.bats \
               tests/clean_app_caches.bats

  security:
    name: Security Checks
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install tools
        run: brew install bats-core coreutils

      - name: Check for unsafe rm usage
        run: python3 scripts/audit_destructive_sinks.py

      # The only job with full history, so the ledger's commits are resolved
      # here; check.sh in the shallow Check job only shape-checks them.
      - name: Check the incident ledger
        run: python3 scripts/audit_incidents.py

      - name: Verify app protection
        run: |
          echo "Verifying critical file protection..."
          bash -c '
          source lib/core/common.sh
          if should_protect_from_uninstall "com.apple.Safari"; then
            echo "✓ Safari is protected"
          else
            echo "✗ Safari protection failed"
            exit 1
          fi
          '

      # gitleaks-action needs a license key for repositories owned by an
      # organization, which this fork is; the CLI it wraps does not. Pin the
      # release and its checksums, and scan the commits this event brings,
      # as the action did.
      - name: Scan for secrets (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256_ARM64: b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5
          GITLEAKS_SHA256_X64: dfe101a4db2255fc85120ac7f3d25e4342c3c20cf749f2c20a18081af1952709
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$RUNNER_ARCH" in
            ARM64) arch=arm64; expected="$GITLEAKS_SHA256_ARM64" ;;
            X64) arch=x64; expected="$GITLEAKS_SHA256_X64" ;;
            *) echo "No pinned gitleaks build for runner arch $RUNNER_ARCH" >&2; exit 1 ;;
          esac
          archive="gitleaks_${GITLEAKS_VERSION}_darwin_${arch}.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${expected}  ${RUNNER_TEMP}/${archive}" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          zero_sha=0000000000000000000000000000000000000000
          range=""
          if [[ -n "$BASE_SHA" ]]; then
            range="${BASE_SHA}..${HEAD_SHA}"
          elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "$zero_sha" ]]; then
            range="${BEFORE_SHA}..${HEAD_SHA}"
          fi
          args=(git --config .gitleaks.toml --redact --no-banner --exit-code 1)
          if [[ -n "$range" ]]; then
            args+=(--log-opts="$range")
          fi
          "$RUNNER_TEMP/gitleaks" "${args[@]}"

      - name: Run high-risk path regression tests
        env:
          MOLE_TEST_NO_AUTH: "1"
          BATS_FORMATTER: tap
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: bats tests/core_safe_functions.bats tests/purge.bats tests/installer.bats
