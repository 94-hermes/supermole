name: Release

on:
  push:
    tags:
      - 'V*'

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: release-amd64
            artifact_name: binaries-amd64
          - os: macos-latest
            target: release-arm64
            artifact_name: binaries-arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify release tag matches source version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          SOURCE_VERSION=$(sed -n 's/^VERSION="\([^"]*\)"$/\1/p' mole)
          EXPECTED_TAG="V${SOURCE_VERSION}"
          if [[ -z "$SOURCE_VERSION" || "$RELEASE_TAG" != "$EXPECTED_TAG" ]]; then
            echo "Release tag ${RELEASE_TAG} does not match source ${EXPECTED_TAG}" >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build Binaries
        run: |
          make ${{ matrix.target }}
          ls -l bin/
          ./scripts/check_release_minos.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact_name }}
          path: bin/*-darwin-*
          retention-days: 1

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      attestations: write
      id-token: write
      actions: read
    steps:
      # The fork releases only a commit whose Check and Validation runs are
      # green, so a red or cancelled run can never publish. Missing and
      # cancelled runs count as failures. Both run on every push to main,
      # docs-only ones included. CodeQL and Nix still run but do not gate a
      # fork release, and the fork has no Homebrew formula to update.
      - name: Verify required workflows passed for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          required=(Check Validation)
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$TARGET_SHA" --limit 100 \
            --json name,status,conclusion)
          missing=()
          for workflow in "${required[@]}"; do
            passed=$(printf '%s' "$runs" | jq -r --arg name "$workflow" \
              '[ .[] | select(.name == $name and .status == "completed" and .conclusion == "success") ] | length')
            if [[ "$passed" -eq 0 ]]; then
              missing+=("$workflow")
            fi
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Release blocked: no successful completed ${missing[*]} run for ${TARGET_SHA}."
            echo "Next action: run the missing workflow with workflow_dispatch on tag ${TAG} (or on a branch at ${TARGET_SHA}), wait for it to finish green at https://github.com/${GITHUB_REPOSITORY}/commit/${TARGET_SHA}/checks, then re-run this release workflow. A cancelled, skipped or missing run is not release evidence."
            exit 1
          fi
          echo "Required workflows all passed for ${TARGET_SHA}"

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: bin
          pattern: binaries-*
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -R bin/

      - name: Generate release checksums
        run: |
          cd bin
          mapfile -t release_files < <(find . -maxdepth 1 -type f -printf '%P\n' | sort)
          if [[ ${#release_files[@]} -eq 0 ]]; then
            echo "No release assets found"
            exit 1
          fi
          sha256sum "${release_files[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            bin/analyze-darwin-*
            bin/status-darwin-*
            bin/SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ github.ref_name }}
          files: bin/*
          generate_release_notes: false
          draft: false
          # A tag carrying a pre-release segment stays a prerelease, so it can
          # never become releases/latest and reach install.sh or `mo update`.
          prerelease: ${{ contains(github.ref_name, '-') }}
